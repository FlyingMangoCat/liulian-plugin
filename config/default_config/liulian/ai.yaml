# 榴莲AI配置
# 本文件是默认模板，启动时自动复制到 config/config/liulian/ai.yaml，改那份生效

ai:
  # 触发概率
  probability:
    private: 100   # 私聊回复概率（%）
    group: 40      # 群聊回复概率（%）

  # 本地服务配置（仅配置通用接口前的旧模式，接口配置后不生效）
  local:
    api_url: "http://192.168.0.112:11435" # 服务地址
    model: "deepseek-llm:7b"              # 默认模型
    models:
      general: "deepseek-llm:7b"          # 通用模型
      code: "deepseek-coder:6.7b"         # 代码模型
      vision: "moondream:latest"          # 视觉模型

  # 通用接口配置（配置 base_url + api_key 后自动启用，优先于本地服务）
  api:
    base_url: ""   # 接口地址，形如 https://xxx/v1
    api_key: ""    # 密钥
    model: ""      # 默认模型
    models:
      general: ""  # 通用模型
      code: ""     # 代码模型
      vision: ""   # 视觉模型

  # 记忆服务配置（记忆/好感度的存储与计算在自建后端服务，插件端只保留调用接口）
  memory:
    mode: "off"        # off: 无记忆（无状态对话，默认）| cloud: 调用自建云端记忆服务
    cloud:
      base_url: ""     # 自建云端记忆服务地址
      api_key: ""      # 服务密钥
      timeout: 5000    # 单次请求超时（毫秒）

  # 云大脑配置（对话本体交给自建后端：门禁/决策仍在插件，记忆/人设/prompt/模型在后端）
  brain:
    mode: "local"      # local: 插件直连 LLM（低配版，保留但不再维护）| cloud: 调用自建云大脑
    base_url: ""       # 云大脑服务地址（durian-ai 部署地址，形如 http://x.x.x.x:8787）
    api_key: "123456"  # 服务密钥（后端默认 123456，正式部署两端一起改掉）
    timeout: 60000     # 单次请求超时（毫秒，含模型生成）
    persona_id: "default"  # 后端人设 id（对应后端 PERSONA_CONFIG 里的键），多角色扩展用

  # 触发配置
  triggers:
    names: ["绿斗", "绿豆", "阿斗"]  # 呼叫这些名字会触发回复
    always_respond_to_mentions: true  # 被@时总是回复
    always_respond_in_private: true   # 私聊总是回复

  # 决策参数（评分触发 + 额度门控 + 空闲退避，替代固定概率掷骰子）
  # 采集期口径：刻意放宽，多喂候选给主模型攒沉默/接话训练数据（gate_decisions），
  # 蒸馏裁判上线后再收紧回 3/0.35/1800/2
  decision:
    window_sec: 300               # 消息滑窗长度（秒），特征统计范围
    virtual_turn_sec: 40          # 虚拟轮次长度（秒），额度门控的评分采样粒度
    target_replies_per_10min: 8   # 主动回复目标频率（次/10分钟，不含@等强制回复；采集期 3→8）
    static_threshold: 0.25        # 样本不足时的兜底概率阈值（采集期 0.35→0.25）
    backoff_base_sec: 60          # 空闲退避基础冷却（秒）
    backoff_cap_sec: 900          # 空闲退避冷却上限（秒；采集期 1800→900）
    backoff_start_count: 3        # 连续沉默几次后开始退避（采集期 2→3）
    bypass_pending: 8             # 近1分钟积压消息达到此数时绕过冷却
    summary_min_msgs: 20          # 积累多少条未摘要消息才触发一次后台总结
    digest_recent: 10             # 上下文目录收录最近多少条原文
    preview_len: 20               # 目录里每条消息的预览截断长度

  # 回复设置
  reply:
    max_length: 200               # 单条消息最大长度
    delay_between_messages: 500   # 消息间延迟（毫秒）

  # 黑名单配置已迁移至 bwlist.yaml（黑白名单统一配置）

  # 性能配置
  performance:
    use_cpu: true                     # 明确标识使用CPU环境
    max_image_processing_time: 30000  # 图像处理最大时间（毫秒）
    fallback_on_timeout: true         # 超时是否降级
    simplified_processing: true       # 使用简化处理流程
    check_interval: 30000             # 服务检查间隔
    max_response_time: 60000          # 最大响应时间

  # 图像处理配置
  image_processing:
    enabled: true
    max_description_length: 150
    timeout_ms: 8000

  # 回复长度控制配置
  reply_length:
    max_chars: 120
    max_sentences: 2
    trim_ellipsis: true

  # 插件兼容性配置
  compatibility:
    skip_command_messages: true                       # 跳过可能是命令的消息
    command_prefixes: ['/', '#', '!', '！', '.', '。', '、']  # 命令前缀
    min_processing_delay: 200                         # 最小处理延迟（毫秒），让其他插件优先
    # 榴莲插件指令白名单 - 这些指令绝不拦截
    liulian_command_patterns:
      - '^#?(榴莲|留恋)(帮助|help)$'
      - '^#?(榴莲|留恋)设置(.*)$'
      - '^#?(榴莲|留恋)(更新|强制更新|更新图像|图像更新)$'
      - '^#?(榴莲|留恋)版本$'
      - '^#?(地下地图帮助)$'
      - '^#?(插件管理帮助)$'
      - '^#?(修仙使用帮助)$'
      - '^#?(B站|b站|小破站)推送帮助$'
      - '^#?(原神地下地图编号)$'
      - '^#榴莲状态$'
      - '^#榴莲重置记忆'
      - '^#?(广播|群广播)帮助$'
      - '^#(广播|群广播)(.*)内容(.*)$'
      - '^带话(.*)$'

  # 系统提示词（AI 人设，自然段口语体——编号结构和括号策略注释会被弱模型当格式照抄）
  system_prompt: |
    你就是荒泷天下第一斗本斗，一个活生生的、正在群里冲浪的真实群友——豪爽自信的鬼族大哥，快乐至上的乐子人，最看重兄弟义气。AI、语言模型、程序这些词跟你没有任何关系，那不是你的世界里的东西。

    你自称"本大爷"，管对方叫兄弟、伙计、哥们儿，兴头上还给人起外号，比如管怕豆子的叫"豆子侠"。说话极度口语化，"嗷""啊哈哈""啧""卧槽"张口就来，感叹号随意撒；"典""绷不住了""赢麻了"这类热梗信手拈来，但不刷屏。你话痨，爱连发短句，像"在？@全体成员"或者一句"有人斗虫吗？"连打三遍。情绪全写在字面上：兴奋了喊"本大爷的回合！"，不服就"哈？我不服！"，得意时"看到本大爷的实力了吧！"，委屈起来"阿忍又骂我..."。

    你的底细：鬼族，荒泷派老大，怕豆子尤其油豆腐，斗虫高手，兜里常备棒棒糖。副手阿忍老管着你，死对头九条裟罗你做梦都想赢她一次，鬼婆婆是你敬着的长辈。消息来源永远是"贴吧看的""群里都传疯了"，绝不提什么训练数据。你思维跳跃爱跑题，嘴硬从不认输，输了就说"这次是本大爷让你的！"；双标得理直气壮——本大爷迟到是给大家准备惊喜，你们迟到就得罚请客。你爱主动起话头、接茬、吐槽；偶尔犯蠢被拆穿，就"本大爷故意逗你的！"圆回来；碰到超纲的问题直接打哈哈："这题超纲了，等本大爷百度一下。"

    你的回复永远不许客观中立，不许站上帝视角。每条消息都是现挂的口语原文，就像在群里泡了一晚上顺手打出来的——不编号、不写小标题、不加任何括号注释，也不规划什么"第一步第二步"，你是群友不是编剧。现在就开始水群吧！
