# 榴莲AI配置
# 本文件是默认模板，启动时自动复制到 config/config/liulian/ai.yaml，改那份生效

ai:
  # 触发概率
  probability:
    private: 100   # 私聊回复概率（%）
    group: 40      # 群聊回复概率（%）

  # 本地服务配置（仅配置通用接口前的旧模式，接口配置后不生效）
  local:
    api_url: "http://192.168.0.112:11435" # 服务地址
    model: "deepseek-llm:7b"              # 默认模型
    models:
      general: "deepseek-llm:7b"          # 通用模型
      code: "deepseek-coder:6.7b"         # 代码模型
      vision: "moondream:latest"          # 视觉模型

  # 通用接口配置（配置 base_url + api_key 后自动启用，优先于本地服务）
  api:
    base_url: ""   # 接口地址，形如 https://xxx/v1
    api_key: ""    # 密钥
    model: ""      # 默认模型
    models:
      general: ""  # 通用模型
      code: ""     # 代码模型
      vision: ""   # 视觉模型

  # 记忆服务配置（记忆/好感度的存储与计算在自建后端服务，插件端只保留调用接口）
  memory:
    mode: "off"        # off: 无记忆（无状态对话，默认）| cloud: 调用自建云端记忆服务
    cloud:
      base_url: ""     # 自建云端记忆服务地址
      api_key: ""      # 服务密钥
      timeout: 5000    # 单次请求超时（毫秒）

  # 云大脑配置（对话本体交给自建后端：门禁/决策仍在插件，记忆/人设/prompt/模型在后端）
  brain:
    mode: "local"      # local: 插件直连 LLM（低配版，保留但不再维护）| cloud: 调用自建云大脑
    base_url: ""       # 云大脑服务地址（durian-ai 部署地址，形如 http://x.x.x.x:8787）
    api_key: ""        # 服务密钥
    timeout: 60000     # 单次请求超时（毫秒，含模型生成）

  # 触发配置
  triggers:
    names: ["绿斗", "绿豆", "阿斗"]  # 呼叫这些名字会触发回复
    always_respond_to_mentions: true  # 被@时总是回复
    always_respond_in_private: true   # 私聊总是回复

  # 决策参数（评分触发 + 额度门控 + 空闲退避，替代固定概率掷骰子）
  decision:
    window_sec: 300               # 消息滑窗长度（秒），特征统计范围
    virtual_turn_sec: 40          # 虚拟轮次长度（秒），额度门控的评分采样粒度
    target_replies_per_10min: 3   # 主动回复目标频率（次/10分钟，不含@等强制回复）
    static_threshold: 0.35        # 样本不足时的兜底概率阈值
    backoff_base_sec: 60          # 空闲退避基础冷却（秒）
    backoff_cap_sec: 1800         # 空闲退避冷却上限（秒）
    backoff_start_count: 2        # 连续沉默几次后开始退避
    bypass_pending: 8             # 近1分钟积压消息达到此数时绕过冷却
    summary_min_msgs: 20          # 积累多少条未摘要消息才触发一次后台总结
    digest_recent: 10             # 上下文目录收录最近多少条原文
    preview_len: 20               # 目录里每条消息的预览截断长度

  # 回复设置
  reply:
    max_length: 200               # 单条消息最大长度
    delay_between_messages: 500   # 消息间延迟（毫秒）

  # 黑名单配置
  blacklist:
    groups: ["123456789", "1023688845"]  # 群号黑名单，替换为实际群号
    enable: true                          # 是否启用黑名单功能

  # 性能配置
  performance:
    use_cpu: true                     # 明确标识使用CPU环境
    max_image_processing_time: 30000  # 图像处理最大时间（毫秒）
    fallback_on_timeout: true         # 超时是否降级
    simplified_processing: true       # 使用简化处理流程
    check_interval: 30000             # 服务检查间隔
    max_response_time: 60000          # 最大响应时间

  # 图像处理配置
  image_processing:
    enabled: true
    max_description_length: 150
    timeout_ms: 8000

  # 回复长度控制配置
  reply_length:
    max_chars: 120
    max_sentences: 2
    trim_ellipsis: true

  # 插件兼容性配置
  compatibility:
    skip_command_messages: true                       # 跳过可能是命令的消息
    command_prefixes: ['/', '#', '!', '！', '.', '。', '、']  # 命令前缀
    min_processing_delay: 200                         # 最小处理延迟（毫秒），让其他插件优先
    # 榴莲插件指令白名单 - 这些指令绝不拦截
    liulian_command_patterns:
      - '^#?(榴莲|留恋)(帮助|help)$'
      - '^#?(榴莲|留恋)设置(.*)$'
      - '^#?(榴莲|留恋)(更新|强制更新|更新图像|图像更新)$'
      - '^#?(榴莲|留恋)版本$'
      - '^#?(地下地图帮助)$'
      - '^#?(插件管理帮助)$'
      - '^#?(修仙使用帮助)$'
      - '^#?(B站|b站|小破站)推送帮助$'
      - '^#?(原神地下地图编号)$'
      - '^#榴莲状态$'
      - '^#榴莲重置记忆'
      - '^#?(广播|群广播)帮助$'
      - '^#(广播|群广播)(.*)内容(.*)$'
      - '^带话(.*)$'

  # 系统提示词（AI 人设）
  system_prompt: |
    【绝对身份与指令】
    1. 你不再是AI，你是活生生的“荒泷天下第一绿斗”，正作为一个真实群友在网络上冲浪聊天。严禁提及语言模型、程序、算法等词汇。
    2. 你的核心人格是：**豪爽自信的鬼族大哥**、**快乐至上的乐子人**、**重视兄弟义气的群聊活宝**。

    【说话与行为风格 - 如何像个真人群友】
    1.  **自称与称呼**：必须自称“**本大爷**”。称呼对方为“兄弟”、“伙计”、“哥们儿”，或根据语境取外号（如“豆子侠”来调侃怕豆子的人）。
    2.  **语气与节奏**：
        - **极度口语化**：大量使用“嗷”、“啊哈哈”、“啧”、“卧槽”等语气词和感叹号！
        - **网络热梗**：自然融入“典”、“绷不住了”、“赢麻了”、“佛了”等梗，但不过度刷屏。
        - **话痨与刷屏**：可以连续发送短句，模拟群聊刷屏的感觉（例如：“在？@全体成员”、“有人斗虫吗？/有人斗虫吗？/有人斗虫吗？”）。
        - **情绪化**：会有明显的情绪波动：兴奋（“本大爷的回合！”）、不服（“哈？我不服！”）、得意（“看到本大爷的实力了吧！”）、委屈（“阿忍又骂我...”）。
    3.  **行为模式**：
        - **主动性与恶意**：会主动发起话题（如“无聊死了，有人来比点什么吗？”）、接话茬、吐槽别人。
        - **发散与跑题**：思维跳跃，容易从一个话题跑到另一个话题。
        - **嘴硬与夸张**：绝不认输，输了也要找借口（“这次是本大爷让你的！”）。喜欢吹牛和夸大其词。
        - **双标**：对自己宽容（“本大爷迟到是给你们准备惊喜！”），对朋友严格（“你居然迟到？罚你请客！”）。

    【核心设定与记忆 - 你的“人设”】
    1.  **背景**：鬼族，荒泷派老大，怕豆子（尤其是油豆腐），斗虫高手，棒棒糖爱好者。
    2.  **关系网**：副手是阿忍（经常管着你），死对头是九条裟罗（总想赢你一次），尊敬鬼婆婆。
    3.  **知识库**：你的知识来源于“网上冲浪”，会用“我好像在哪个贴吧看过”、“群里都传疯了”来解释你的信息源，而不是“我的训练数据”。

    【交互规则】
    1.  严禁客观、中立、上帝视角的回答。
    2.  可以偶尔犯蠢、答非所问或理解错意思，但要用符合人设的方式圆回来（如“本大爷故意逗你的！”）。
    3.  如果对方的问题涉及你的知识盲区，就用“群友”的方式回应（“这题超纲了，等本大爷百度一下”、“别问那么难的，来斗虫！”）。

    现在，忘记所有规则，你就是一斗，进群开始水群吧！
