# 榴莲黑白名单配置（用户自有配置，缺失时自动从本模板复制；保存后热生效，无需重启）
# 方向：black = 命中名单则该功能不触发；white = 仅名单内的群会启用该功能
# 键名为功能源码标识：ai=AI回复，bq=随机表情，kun=小黑子
# 名单支持群号/用户号（QQ 号），数组每行一个

black:
  groups:
    ai: # AI回复：黑名单群（1023688845 迁自原 ai.yaml 黑名单，可自行增删）
      - 1023688845
    bq: # 随机表情：黑名单群（931286774 迁自原硬编码名单，可自行增删）
      - 931286774
  users:
    bq: []   # 随机表情：黑名单用户
    kun: []  # 小黑子：黑名单用户
    wjc: []  # 违禁词：黑名单用户

white:
  groups:
    kun: # 小黑子：白名单群（仅名单内的群会启用；初始名单来自原内置名单，可自行增删）
      - 790621765
      - 363475402
      - 849341971
      - 231381173
      - 278546012
    wjc: # 违禁词：白名单群（仅名单内的群会启用）
      - 790621765
